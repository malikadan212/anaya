kind = "web"
previewPath = "/"
title = "Lumière — Luxury Jewellery"
version = "1.0.0"
id = "artifacts/lumiere"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19130

[services.development]
run = "pnpm --filter @workspace/lumiere run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lumiere", "run", "build" ]
serve = "static"
publicDir = "artifacts/lumiere/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19130"
BASE_PATH = "/"
